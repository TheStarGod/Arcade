<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cookie Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kavoon&family=Merriweather+Sans:wght@400;700;800&display=swap">
<style>
/* Layout: three columns like a bakery counter — the big cookie on the left, your buildings at work in the middle, the store on the right. Stacks to one column on phones. */
:root{
  --bg:#1f3a5c; --bg2:#173052; --panel:rgba(8,16,32,.55); --line:rgba(255,255,255,.14);
  --ink:#fff8ec; --dim:#c8d3e6; --gold:#ffd25a; --good:#7cf29a; --bad:#ff8080; --dough:#c9852e;
  --font-display:"Kavoon","Georgia",serif; --font-ui:"Merriweather Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 20% 10%,#2f5687,var(--bg) 45%,var(--bg2));color:var(--ink);font-family:var(--font-ui);font-size:14px;overflow:hidden}
body.theme-night{--bg:#141626;--bg2:#0b0c16;background:radial-gradient(circle at 20% 10%,#2a2d4a,#141626 45%,#0b0c16)}
body.theme-rose{--bg:#5c2041;--bg2:#3a1229;background:radial-gradient(circle at 20% 10%,#8a3a64,#5c2041 45%,#3a1229)}
body.theme-mint{--bg:#1d4a43;--bg2:#12322d;background:radial-gradient(circle at 20% 10%,#2e7366,#1d4a43 45%,#12322d)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#top{height:44px;display:flex;align-items:center;gap:10px;padding:0 max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.35);border-bottom:1px solid var(--line)}
#top a,#top button{font-weight:700;font-size:13px;text-decoration:none;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
#top h1{margin:0 auto 0 4px;font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.02em;white-space:nowrap}
#news{flex:1;min-width:0;overflow:hidden;white-space:nowrap;color:var(--dim);font-size:13px;font-style:italic}

#game{height:calc(100% - 44px);display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(0,1.4fr) minmax(300px,1fr)}
#left{position:relative;overflow:hidden;border-right:4px solid rgba(0,0,0,.35);background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.08),transparent 60%)}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
#bank{position:absolute;top:14px;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#bakery{pointer-events:auto;cursor:pointer;display:inline-block;font-family:var(--font-display);font-size:22px;padding:2px 10px;border-radius:8px;background:rgba(0,0,0,.3);border:0}
#count{font-family:var(--font-display);font-size:30px;margin-top:6px;line-height:1.1}
#cps{font-size:13px;color:var(--dim)}
#buffs{position:absolute;bottom:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.buff{background:rgba(0,0,0,.55);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:800}

#middle{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:rgba(0,0,0,.12)}
.strip{position:relative;flex-shrink:0;border-radius:6px;border:3px solid #2a1a0a;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12),0 4px 0 rgba(0,0,0,.3);overflow:hidden;background:#000}
.strip canvas{display:block;width:100%;height:90px;image-rendering:pixelated;image-rendering:crisp-edges}
.strip h3{position:absolute;left:6px;top:6px;margin:0;font-size:11px;color:#fff;line-height:1.25;padding:3px 7px;background:rgba(20,10,0,.72);border:2px solid #000;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);border-radius:3px;text-shadow:1px 1px 0 #000;pointer-events:none}
.strip h3 b{display:block;font-family:var(--font-display);font-weight:400;font-size:15px;line-height:1.1;margin-bottom:1px;color:var(--ink);letter-spacing:0;text-transform:none}
.strip .count{position:absolute;right:6px;bottom:4px;font-family:var(--font-display);font-size:20px;color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none}
#middle .empty{color:var(--dim);text-align:center;padding:40px 10px;line-height:1.6}

#store{overflow:auto;border-left:4px solid rgba(0,0,0,.35);background:rgba(0,0,0,.2);display:grid;align-content:start}
.sec{padding:10px 12px;border-bottom:1px solid var(--line)}
.sec h2{margin:0 0 8px;font-family:var(--font-display);font-weight:400;font-size:20px;display:flex;justify-content:space-between;align-items:center}
#upgrades{display:flex;flex-wrap:wrap;gap:5px;min-height:10px}
.up{width:46px;height:46px;border-radius:4px;border:3px solid #2a1a0a;background:#3b2a19;display:grid;place-items:center;cursor:pointer;position:relative;padding:0;box-shadow:inset 0 0 0 2px var(--tier,#c9852e)}
.up img,.ach img{width:32px;height:32px;image-rendering:pixelated;image-rendering:crisp-edges}
.up small{position:absolute;bottom:0;right:2px;font-size:9px;font-weight:800;color:var(--gold);text-shadow:1px 1px 0 #000}
.up.cant{filter:grayscale(.7) brightness(.65)}
.modes{display:flex;gap:4px}
.modes button{font-size:12px;font-weight:800;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.06);cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.bld{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid rgba(255,255,255,.07);background:linear-gradient(90deg,rgba(201,133,46,.18),transparent);cursor:pointer}
.bld:hover{background:linear-gradient(90deg,rgba(255,210,90,.28),rgba(255,255,255,.04))}
.bld .ic{width:40px;height:48px;border:2px solid #000;border-radius:3px;image-rendering:pixelated;image-rendering:crisp-edges;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.bld .nm{font-family:var(--font-display);font-size:19px;line-height:1.1}
.bld .pr{font-size:13px;font-weight:800;color:var(--good)}
.bld.cant .pr{color:var(--bad)}
.bld.cant{opacity:.75}
.bld .own{font-family:var(--font-display);font-size:30px;color:rgba(255,255,255,.35);min-width:40px;text-align:right}
.bld.locked .nm,.bld.locked .ic{filter:brightness(0);opacity:.6}
#away{position:fixed;z-index:22;left:50%;top:56px;transform:translateX(-50%);width:min(440px,calc(100% - 24px));padding:14px 16px;border-radius:10px;background:#13223a;border:3px solid var(--gold);box-shadow:0 10px 30px rgba(0,0,0,.5);display:grid;gap:6px;text-align:center}
#away b{font-family:var(--font-display);font-weight:400;font-size:22px;color:var(--gold)}
#away button{justify-self:center}

#tip{position:fixed;z-index:20;max-width:320px;padding:10px 12px;border-radius:10px;background:rgba(10,14,26,.96);border:1px solid var(--gold);pointer-events:none;font-size:13px;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#tip b{font-family:var(--font-display);font-weight:400;font-size:17px}
#tip .price{color:var(--good);font-weight:800}
#tip q{display:block;color:var(--dim);font-style:italic;margin-top:4px}
#tip q::before,#tip q::after{content:""}

.golden{position:fixed;z-index:15;width:86px;height:86px;border:0;padding:0;border-radius:50%;cursor:pointer;background:transparent center/100% 100% no-repeat;filter:drop-shadow(0 0 10px rgba(255,214,90,.95)) drop-shadow(0 4px 6px rgba(0,0,0,.35));animation:gbob 2.4s ease-in-out infinite;isolation:isolate}
.golden::before{content:"";position:absolute;inset:-34px;z-index:-1;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,170,.55) 0 9deg,transparent 9deg 24deg);-webkit-mask:radial-gradient(circle,#000 28%,transparent 68%);mask:radial-gradient(circle,#000 28%,transparent 68%);animation:gspin 7s linear infinite}
.golden::after{content:"";position:absolute;width:10px;height:10px;left:14px;top:12px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:gtwinkle 1.4s ease-in-out infinite}
.golden.fading{opacity:.35;transition:opacity 1s}
@keyframes gbob{50%{transform:translateY(-6px) rotate(6deg) scale(1.05)}}
@keyframes gspin{to{transform:rotate(360deg)}}
@keyframes gtwinkle{50%{transform:scale(.3);opacity:.4}}
.pop{position:fixed;z-index:16;pointer-events:none;font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 4px #000;transition:transform 1.2s ease-out,opacity 1.2s;white-space:nowrap}

.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(5,10,20,.75);overflow:auto}
.card{width:min(640px,100%);max-height:min(860px,100%);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;padding:20px;border-radius:14px;background:#13223a;border:1px solid var(--line);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:28px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.cbody{overflow:auto;min-height:0;padding-right:4px}
.cbody h3{margin:14px 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.cbody h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.row .ctl{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.row select{font:700 13px var(--font-ui);color:var(--ink);background:#0d1830;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--gold)}
.row output{min-width:44px;text-align:right;color:var(--dim);font-weight:700}
.switch{appearance:none;-webkit-appearance:none;width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;margin:0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch:checked{background:var(--gold)}
.switch:checked::after{transform:translateX(20px)}
.stats{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px}
.stats span{color:var(--dim)}
.achs{display:flex;flex-wrap:wrap;gap:5px}
.ach{width:40px;height:40px;border-radius:4px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:2px solid #000;cursor:help}
.ach img{width:28px;height:28px}
.ach.no{filter:grayscale(1) brightness(.4)}
.btn{font-weight:800;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.08);cursor:pointer}
.btn.gold{background:linear-gradient(180deg,#ffe6a0,var(--gold));color:#2b1a00;border:0}
.btn.red{background:#7a1f2a;border-color:#ff8080}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
#dev{position:fixed;z-index:25;right:max(12px,env(safe-area-inset-right,0px));bottom:max(12px,env(safe-area-inset-bottom,0px));width:230px;padding:10px;border-radius:12px;background:rgba(40,0,40,.92);border:2px solid #ff6bd6;display:grid;gap:6px}
#dev h3{margin:0;font-size:13px;letter-spacing:.12em;color:#ff9be6}
#dev button{font-size:12px;font-weight:800;padding:6px;border-radius:6px;border:1px solid #ff6bd6;background:rgba(255,107,214,.15);cursor:pointer}

@media (max-width:900px){
  body{overflow:auto}
  #game{height:auto;grid-template-columns:1fr}
  #left{height:62vh;min-height:360px;border-right:0}
  #middle{max-height:none}
  #store{border-left:0;overflow:visible}
  #news{display:none}
  .row{grid-template-columns:1fr}
  .row .ctl{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){.golden{animation:none}.pop{transition:opacity 1.2s}}
</style>
</head>
<body>
<header id="top">
  <a href="arcade.html">&larr; Games</a>
  <h1>Cookie Empire</h1>
  <div id="news" aria-live="polite"></div>
  <button type="button" id="b-stats">Stats</button>
  <button type="button" id="b-opts">Options</button>
</header>
<main id="game">
  <section id="left" aria-label="Big cookie">
    <canvas id="cv"></canvas>
    <div id="bank">
      <button type="button" id="bakery" title="Rename your bakery">My bakery</button>
      <div id="count" class="num">0 cookies</div>
      <div id="cps" class="num">per second: 0</div>
    </div>
    <div id="buffs"></div>
  </section>
  <section id="middle" aria-label="Your buildings at work"></section>
  <aside id="store" aria-label="Store">
    <div class="sec"><h2>Upgrades <span class="modes" id="upmode"></span></h2><div id="upgrades"></div></div>
    <div class="sec" style="padding-bottom:4px"><h2>Buildings
      <span class="modes"><button type="button" id="m-buy" aria-pressed="true">Buy</button><button type="button" id="m-sell" aria-pressed="false">Sell</button>
      <button type="button" data-n="1" aria-pressed="true">1</button><button type="button" data-n="10" aria-pressed="false">10</button><button type="button" data-n="100" aria-pressed="false">100</button></span></h2></div>
    <div id="buildings"></div>
  </aside>
</main>
<div id="tip" hidden></div>
<div id="away" hidden role="status"><b>Welcome back!</b><span id="away-text"></span><button class="btn gold" type="button" id="away-ok">Nice!</button></div>

<div class="overlay" id="stats" hidden>
  <div class="card"><h2>Stats <button class="btn" type="button" data-close>Close</button></h2><div class="cbody" id="stats-body"></div><div class="btnrow" id="ascend-row"></div></div>
</div>
<div class="overlay" id="opts" hidden>
  <div class="card"><h2>Options <button class="btn" type="button" data-close>Close</button></h2><div class="cbody" id="opts-body"></div>
    <div class="btnrow"><button class="btn" type="button" id="save-now">Save now</button><button class="btn red" type="button" id="wipe">Wipe save…</button><span id="opt-note" style="align-self:center;color:var(--gold);font-weight:700"></span></div></div>
</div>
<div class="overlay" id="confirm" hidden>
  <div class="card" style="width:min(420px,100%);grid-template-rows:auto auto auto"><h2 id="cf-title">Are you sure?</h2><p id="cf-text" style="margin:0;color:var(--dim);line-height:1.5"></p>
    <div class="btnrow"><button class="btn red" type="button" id="cf-yes">Yes</button><button class="btn" type="button" id="cf-no">Cancel</button></div></div>
</div>
<div id="dev" hidden>
  <h3>OPEN SESAME · DEV TOOLS</h3>
  <button type="button" data-dev="x1000">Cookies × 1000</button>
  <button type="button" data-dev="golden">Spawn golden cookie</button>
  <button type="button" data-dev="frenzy">Frenzy now</button>
  <button type="button" data-dev="click">Click frenzy now</button>
  <button type="button" data-dev="off">Turn Open Sesame off</button>
  <button type="button" data-dev="close">Hide panel</button>
</div>

<script>
/* Pixel art for Cookie Empire: animated building scenes, store icons, and the
   realistic big cookie + golden cookie images. Loaded by cookie-empire.html. */
(function(){
'use strict';
const PX = (g, c, x, y, w, h) => { g.fillStyle = c; g.fillRect(Math.round(x), Math.round(y), w || 1, h || 1); };
function line(g, c, x0, y0, x1, y1){
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (let n = 0; n < 200; n++){ PX(g, c, x0, y0); if (x0 === x1 && y0 === y1) break; const e2 = 2*e; if (e2 >= dy){ e += dy; x0 += sx; } if (e2 <= dx){ e += dx; y0 += sy; } }
}
// fixed pseudo-random so backgrounds don't flicker
const rnd = s => { s = Math.sin(s*127.1)*43758.5453; return s - Math.floor(s); };
const SKIN = '#f0c49a', SKIN2 = '#c98d64';
const head = (g, x, y, skin) => { PX(g, skin || SKIN, x, y, 4, 3); PX(g, '#2a1a10', x + 1, y + 1); PX(g, '#2a1a10', x + 3, y + 1); };

/* ---------- scenes: background + one worker. G is the ground row, f is the animation frame ---------- */
const S = {};
S.cursor = {
  bg(g, w, h, t){ PX(g, '#4c5f84', 0, 0, w, h); for (let x = 0; x < w; x += 12) PX(g, '#566a92', x, 0, 6, h - 6); PX(g, '#8a5a30', 0, h - 6, w, 6); PX(g, '#6b4422', 0, h - 6, w, 1); },
  worker(g, x, G, f){
    PX(g, '#c98a3e', x + 4, G - 2, 7, 2); PX(g, '#d9a35a', x + 5, G - 3, 5, 1); PX(g, '#4a2611', x + 6, G - 2); PX(g, '#4a2611', x + 9, G - 3);
    const dy = [0, 0, 1, 3, 1, 0][f % 6];
    PX(g, '#3a7bd5', x + 5, G - 15 + dy, 5, 2);
    PX(g, '#ffffff', x + 5, G - 13 + dy, 5, 4); PX(g, '#ffffff', x + 6, G - 9 + dy, 2, 4);
    PX(g, '#c8cdd8', x + 5, G - 10 + dy, 5, 1); PX(g, '#c8cdd8', x + 8, G - 9 + dy, 1, 3);
    if (dy === 3) { PX(g, '#ffe9a8', x + 3, G - 6); PX(g, '#ffe9a8', x + 11, G - 6); }
  }
};
S.grandma = {
  bg(g, w, h){ PX(g, '#e8c9a0', 0, 0, w, h); for (let x = 0; x < w; x += 4) for (let y = 0; y < h - 6; y += 4) if ((x + y)%8 === 0) PX(g, '#efd6b4', x, y, 4, 4); PX(g, '#9a6a3a', 0, h - 6, w, 6); PX(g, '#7a4a22', 0, h - 6, w, 1); },
  worker(g, x, G, f){
    PX(g, '#8a5a30', x + 9, G - 6, 8, 1); PX(g, '#6b4422', x + 10, G - 5, 1, 5); PX(g, '#6b4422', x + 15, G - 5, 1, 5);
    PX(g, '#f2dfb8', x + 11, G - 7, 5, 1);
    PX(g, '#5a4a6a', x + 3, G - 2, 1, 2); PX(g, '#5a4a6a', x + 5, G - 2, 1, 2);
    PX(g, '#a04a8a', x + 2, G - 9, 5, 7); PX(g, '#ffffff', x + 3, G - 8, 3, 5);
    head(g, x + 2, G - 12);
    PX(g, '#d8d8e0', x + 1, G - 14, 6, 2); PX(g, '#d8d8e0', x, G - 15, 2, 2);
    PX(g, '#333344', x + 3, G - 11); PX(g, '#333344', x + 5, G - 11);
    const r = [0, 1, 2, 3, 2, 1][f % 6];
    PX(g, SKIN, x + 7, G - 8, 2 + r, 1);
    PX(g, '#c48a4a', x + 9 + r, G - 8, 5, 1); PX(g, '#8a5a30', x + 8 + r, G - 8); PX(g, '#8a5a30', x + 14 + r, G - 8);
  }
};
S.farm = {
  bg(g, w, h){ PX(g, '#9fd4ff', 0, 0, w, h); PX(g, '#fff3a0', w - 10, 2, 5, 5); PX(g, '#5fa84a', 0, h - 6, w, 6); for (let x = 0; x < w; x += 6) PX(g, '#7a5230', x, h - 4, 4, 1); },
  worker(g, x, G, f, t, i){
    const hgt = 3 + Math.floor(((t*.35 + i*.37) % 1)*6);
    PX(g, '#3c8a3a', x + 14, G - hgt, 1, hgt); PX(g, '#3c8a3a', x + 15, G - hgt + 2, 2, 1);
    PX(g, '#c98a3e', x + 13, G - hgt - 3, 3, 3); PX(g, '#4a2611', x + 14, G - hgt - 2);
    PX(g, '#5a3a20', x + 3, G - 2, 4, 2); PX(g, '#3a5fb0', x + 3, G - 8, 4, 6); PX(g, '#d04040', x + 3, G - 9, 4, 2);
    head(g, x + 3, G - 12);
    PX(g, '#e8c45a', x + 2, G - 13, 6, 1); PX(g, '#e8c45a', x + 3, G - 15, 4, 2); PX(g, '#c9a43a', x + 3, G - 13, 4, 1);
    const k = f % 4;
    const ends = [[7, -17], [11, -14], [11, -2], [11, -14]][k];
    line(g, '#8a5a30', x + 7, G - 8, x + ends[0], G + ends[1]);
    PX(g, '#9aa3b4', x + ends[0] - 1, G + ends[1] - 1, 3, 1);
    if (k === 2){ PX(g, '#7a5230', x + 12, G - 2); PX(g, '#7a5230', x + 13, G - 3); }
  }
};

  // cursors circling the cookie
  const nc = Math.min(S.own.cursor, 50);
  g.font = '20px serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < nc; i++){
    const a = i/nc*Math.PI*2 + t*.2, rr = r + 24 + (i % 2)*16 + (Math.sin(t*4 + i) > .9 ? -6 : 0);
    g.save(); g.translate(cx + Math.cos(a)*rr, cy + Math.sin(a)*rr); g.rotate(a - Math.PI/2); g.fillText('👆', 0, 0); g.restore();
  }
  // floating numbers
  g.font = '800 18px "Merriweather Sans", sans-serif';
  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i]; f.t += dt; f.y -= 50*dt;

    g.strokeText(f.s, f.x, f.y); g.fillText(f.s, f.x, f.y); g.globalAlpha = 1;

  }
}

      c.addEventListener('change', () => { if (it.type === 'sesame') setSesame(c.checked); else { O[it.id] = c.checked; applyOpts(); } }); ctl.appendChild(c);
    } else if (it.type === 'steps'){
      const r = document.createElement('input'); r.type = 'range'; r.id = 'o-' + it.id; r.min = 0; r.max = it.steps.length - 1; r.step = 1;
      let idx = it.steps.indexOf(O[it.id]); if (idx < 0) idx = it.steps.reduce((bi, v, i) => Math.abs(v - O[it.id]) < Math.abs(it.steps[bi] - O[it.id]) ? i : bi, 0); r.value = idx;
      const out = document.createElement('output'); out.textContent = it.fmt(it.steps[idx]);
      r.addEventListener('input', () => { O[it.id] = it.steps[+r.value]; out.textContent = it.fmt(O[it.id]); applyOpts(); if (it.id === 'goldEvery') goldTimer = Math.min(goldTimer, goldDelay()); }); ctl.append(r, out);
    } else {
      const r = document.createElement('input'); r.type = 'range'; r.id = 'o-' + it.id; r.min = it.min; r.max = it.max; r.step = it.step; r.value = O[it.id];
      const out = document.createElement('output'); out.textContent = it.fmt(+O[it.id]);
      r.addEventListener('input', () => { O[it.id] = +r.value; out.textContent = it.fmt(+r.value); applyOpts(); }); ctl.append(r, out);
    }
    el.appendChild(row);
  }
}
function applyOpts(){
  document.body.className = O.theme === 'blue' ? '' : 'theme-' + O.theme;
  saveOpts(); recalc(); renderStore(); renderMiddle(); nextNews();
}

/* ---------- dialogs ---------- */
function open(id){ closeAll(); $(id).hidden = false; }
function closeAll(){ ['stats','opts','confirm'].forEach(id => $(id).hidden = true); }
document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeAll));
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) closeAll(); }));
$('b-stats').addEventListener('click', () => { renderStats(); open('stats'); });
$('b-opts').addEventListener('click', () => { renderOpts(); $('opt-note').textContent = ''; open('opts'); });
$('save-now').addEventListener('click', () => { $('opt-note').textContent = save() ? 'Saved.' : 'Saving is blocked in this browser.'; });
let confirmFn = null;
function ask(title, text, fn){ $('cf-title').textContent = title; $('cf-text').textContent = text; confirmFn = fn; closeAll(); $('confirm').hidden = false; $('cf-no').focus(); }
$('cf-yes').addEventListener('click', () => { const f = confirmFn; confirmFn = null; closeAll(); if (f) f(); });
$('cf-no').addEventListener('click', closeAll);
$('wipe').addEventListener('click', () => ask('Wipe your save?', 'This deletes all cookies, buildings, upgrades, achievements and prestige. It cannot be undone.', () => {
  S = fresh(); buffs.length = 0; $('dev').hidden = true; recalc(); save(); renderName(); renderStore(true); renderMiddle(); toast('Save wiped. Fresh start!');
}));

/* ---------- sound ---------- */
let actx = null;
function sfx(kind){
  if (!O.sound || O.volume <= 0) return;
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e){ return; }
  const o = actx.createOscillator(), gn = actx.createGain(), now = actx.currentTime;
  const v = O.volume*.15;
  const set = {click:[520 + Math.random()*120, .06, 'triangle'], buy:[660, .1, 'square'], sell:[330, .12, 'square'], gold:[880, .4, 'sine'], ach:[990, .3, 'triangle']}[kind] || [440, .1, 'sine'];
  o.type = set[2]; o.frequency.setValueAtTime(set[0], now);
  if (kind === 'gold' || kind === 'ach') o.frequency.exponentialRampToValueAtTime(set[0]*1.5, now + set[1]);
  gn.gain.setValueAtTime(v, now); gn.gain.exponentialRampToValueAtTime(.001, now + set[1]);
  o.connect(gn); gn.connect(actx.destination); o.start(); o.stop(now + set[1] + .02);
}

/* ---------- main loop ---------- */
function dur(sec){ sec = Math.floor(sec); const d = Math.floor(sec/86400), h = Math.floor(sec/3600) % 24, m = Math.floor(sec/60) % 60; return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : m ? `${m}m ${sec % 60}s` : sec + 's'; }
function welcomeBack(sec, got){ $('away-text').textContent = `You were gone for ${dur(sec)}. Your bakery kept going and baked ${fmt(got)} cookies.`; $('away').hidden = false; clearTimeout(welcomeBack.t); welcomeBack.t = setTimeout(() => $('away').hidden = true, 9000); }
$('away-ok').addEventListener('click', () => $('away').hidden = true);
let t = 0, last = performance.now(), uiT = 0, saveT = 0, achT = 0, midT = 0, stripT = 0;
function loop(now){
  requestAnimationFrame(loop);
  const gap = (now - last)/1000; last = now;
  // the browser pauses hidden tabs; when you come back, add what the bakery made meanwhile
  if (gap > 2){ const got = cps()*(gap - 1)*O.offline; if (got > 0){ earn(got); if (gap > 30) welcomeBack(gap, got); } }
  const dt = Math.min(1, gap); t += dt;
  S.playMs += dt*1000;
  earn(cps()*dt);
  // buffs tick down
  let changed = false;
  for (let i = buffs.length - 1; i >= 0; i--){ buffs[i].t -= dt; if (buffs[i].t <= 0){ buffs.splice(i, 1); changed = true; } }
  // golden cookies
  if (goldEl){ if (now > +goldEl.dataset.until){ goldEl.remove(); goldEl = null; } else if (+goldEl.dataset.until - now < 1500) goldEl.classList.add('fading'); }
  else { goldTimer -= dt; if (goldTimer <= 0){ spawnGolden(); goldTimer = goldDelay(); } }
  frameDraw(dt);
  uiT += dt;
  if (uiT > .1){
    uiT = 0;
    $('count').textContent = fmt(S.cookies, true) + (Math.floor(S.cookies) === 1 ? ' cookie' : ' cookies');
    $('cps').textContent = 'per second: ' + fmt(cps()) + (buffMult('cps') > 1 ? ' (×' + buffMult('cps') + ')' : '');
    document.title = fmt(S.cookies, true) + ' cookies · Cookie Empire';
    renderStore(); renderBuffs();
  }
  if (changed) recalc();
  achT += dt; if (achT > 1){ achT = 0; checkAch(); }
  midT += dt; if (midT > 1){ midT = 0; renderMiddle(); }
  stripT += dt; if (stripT > 1/12){ stripT = 0; drawStrips(); }
  newsT += dt; if (newsT > O.newsEvery){ newsT = 0; nextNews(); }
  saveT += dt; if (O.autosave > 0 && saveT > O.autosave){ saveT = 0; save(); }
}
addEventListener('beforeunload', save);
addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });

/* ---------- boot ---------- */
load();
if (S.sesame) $('dev').hidden = false;
document.body.className = O.theme === 'blue' ? '' : 'theme-' + O.theme;
recalc(); renderName(); renderStore(true); renderMiddle(); nextNews(); size();
goldTimer = goldDelay();
requestAnimationFrame(loop);
})();
</script>
