<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Throwback Bowl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Retro football: the field is drawn on a tiny canvas and blown up with hard pixels; menus use pixel fonts to match. */
:root{
  --bg:#10141f; --panel:#1b2233; --panel2:#232c42; --line:#3a4663; --ink:#f4f1e6; --dim:#a8b0c8;
  --gold:#ffd23f; --good:#6fe08a; --bad:#ff6b6b; --blue:#4aa3ff;
  --font-px:"Press Start 2P",monospace; --font-ui:"VT323",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:20px;overflow:hidden;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#top{height:40px;display:flex;align-items:center;gap:8px;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));background:#0a0d15;border-bottom:3px solid #000}
#top a,#top button{font-family:var(--font-px);font-size:9px;text-decoration:none;color:var(--ink);background:var(--panel2);border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:7px 9px;cursor:pointer}
#top h1{font-family:var(--font-px);font-size:11px;margin:0 auto 0 6px;color:var(--gold);text-shadow:2px 2px 0 #000;letter-spacing:1px}
#stage{position:absolute;left:0;right:0;top:40px;bottom:0;display:grid;place-items:center;background:#0b2a12}
#c{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;background:#000}
.ov{position:absolute;inset:0;z-index:10;display:grid;place-items:center;padding:12px;background:rgba(6,8,14,.72);overflow:auto}
.card{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--panel);border:4px solid #000;box-shadow:inset 0 0 0 2px var(--line),0 8px 0 rgba(0,0,0,.4);padding:16px}
.card h2{font-family:var(--font-px);font-size:14px;margin:0 0 12px;color:var(--gold);text-shadow:2px 2px 0 #000;line-height:1.5}
.card h3{font-family:var(--font-px);font-size:10px;margin:14px 0 8px;color:var(--blue)}
.card p{margin:6px 0;line-height:1.05}
.btn{font-family:var(--font-px);font-size:10px;letter-spacing:.5px;background:var(--panel2);color:var(--ink);border:3px solid #000;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #000;padding:10px 12px;cursor:pointer;line-height:1.4}
.btn:active{transform:translateY(3px);box-shadow:inset 0 0 0 2px var(--line),0 1px 0 #000}
.btn.go{background:#2f9e44;box-shadow:inset 0 0 0 2px #6fe08a,0 4px 0 #000}
.btn.gold{background:#c98a00;box-shadow:inset 0 0 0 2px var(--gold),0 4px 0 #000}
.btn.red{background:#a33232;box-shadow:inset 0 0 0 2px #ff8a8a,0 4px 0 #000}
.btn.sm{font-size:8px;padding:6px 8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.logo{font-family:var(--font-px);font-size:clamp(20px,5vw,40px);line-height:1.3;text-align:center;color:var(--gold);text-shadow:4px 4px 0 #b3261e,8px 8px 0 #000;margin:4px 0 18px}
.sub{font-family:var(--font-px);font-size:9px;color:var(--dim);text-align:center;line-height:1.8}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:240px;overflow:auto;padding:2px}
.teams button{display:flex;gap:6px;align-items:center;text-align:left;background:var(--panel2);border:2px solid #000;padding:5px;cursor:pointer;font-size:17px;line-height:1}
.teams button[aria-pressed="true"]{outline:3px solid var(--gold)}
.sw{width:18px;height:18px;border:2px solid #000;flex:none}
input[type=text]{background:#0c1120;border:2px solid #000;box-shadow:inset 0 0 0 1px var(--line);padding:6px 8px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:18px;color:var(--dim)}
.pal{display:flex;gap:4px;flex-wrap:wrap}
.pal button{width:24px;height:24px;border:2px solid #000;cursor:pointer;padding:0}
.pal button[aria-pressed="true"]{outline:3px solid #fff}
/* front office */
#office .card{width:min(980px,100%);height:min(100%,760px);display:flex;flex-direction:column;padding:12px}
.ohead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:3px solid #000;padding-bottom:8px}
.ohead .tname{font-family:var(--font-px);font-size:12px;line-height:1.5}
.meter{display:grid;gap:2px;font-size:16px;color:var(--dim);min-width:110px}
.meter i{display:block;height:8px;background:#000;border:1px solid var(--line);position:relative}
.meter i b{position:absolute;inset:0 auto 0 0;background:var(--good)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.tabs button{font-family:var(--font-px);font-size:8px;padding:8px;background:var(--panel2);border:2px solid #000;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--gold);color:#000}
.obody{flex:1;overflow:auto;padding-right:4px}
table{border-collapse:collapse;width:100%;font-size:18px}
th{font-family:var(--font-px);font-size:7px;text-align:left;color:var(--dim);padding:6px 4px;border-bottom:2px solid #000;position:sticky;top:0;background:var(--panel)}
td{padding:3px 4px;border-bottom:1px solid #2a3350;white-space:nowrap}
tr.me td{background:rgba(255,210,63,.13)}
.stars{color:var(--gold);letter-spacing:-1px}
.pill{font-family:var(--font-px);font-size:7px;padding:3px 5px;border:2px solid #000;background:#0c1120}
.ofoot{display:flex;gap:8px;flex-wrap:wrap;border-top:3px solid #000;padding-top:10px;align-items:center}
.att{display:inline-flex;gap:3px;align-items:center;margin-right:8px}
.att button{font-family:var(--font-px);font-size:7px;padding:2px 4px;background:#2f9e44;border:2px solid #000;cursor:pointer}
.news{display:grid;gap:6px}
.news div{background:#0c1120;border:2px solid #000;padding:6px 8px;line-height:1}
.news small{color:var(--dim)}
#drive .card{width:min(520px,100%)}
#drive ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;min-height:180px}
#drive li{background:#0c1120;border:2px solid #000;padding:4px 8px;line-height:1}
#drive li.big{color:var(--gold);font-family:var(--font-px);font-size:10px;line-height:1.6}
#modal .card{width:min(560px,100%)}
.choices{display:grid;gap:8px;margin-top:10px}
.choices .btn{text-align:left}
#touch{position:absolute;right:10px;bottom:10px;z-index:5;display:flex;gap:8px}
#touch button{font-family:var(--font-px);font-size:9px;width:64px;height:64px;border-radius:50%;background:rgba(20,30,50,.7);border:3px solid #000;color:#fff;touch-action:none}
.set{display:grid;gap:10px}
.set label{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:20px}
.set select{background:#0c1120;border:2px solid #000;padding:4px}
.help{font-size:18px;color:var(--dim);line-height:1.05}
kbd{font-family:var(--font-px);font-size:8px;background:#0c1120;border:2px solid #000;padding:2px 4px}
</style>
</head>
<body>
<div id="top">
  <a href="arcade.html">&larr; Back to games</a>
  <h1>THROWBACK BOWL</h1>
  <button type="button" id="b-office" hidden>Office</button>
  <button type="button" id="b-pause" hidden>Pause</button>
  <button type="button" id="b-settings">Settings</button>
</div>
<div id="stage">
  <canvas id="c" width="320" height="180" aria-label="Football field"></canvas>
  <div id="touch" hidden><button type="button" id="t-juke">JUKE</button><button type="button" id="t-dive">DIVE</button></div>

  <div class="ov" id="title">
    <div class="card" style="width:min(560px,100%)">
      <div class="logo">THROWBACK<br>BOWL</div>
      <p class="sub">RUN THE OFFENSE. BUILD A DYNASTY.<br>WIN THE THROWBACK BOWL.</p>
      <div class="choices">
        <button class="btn go" type="button" id="t-continue">CONTINUE CAREER</button>
        <button class="btn" type="button" id="t-new">NEW CAREER</button>
        <button class="btn" type="button" id="t-howto">HOW TO PLAY</button>
      </div>
    </div>
  </div>

  <div class="ov" id="newcar" hidden>
    <div class="card">
      <h2>NEW CAREER</h2>
      <div class="grid2">
        <label class="f">Coach name<input type="text" id="n-coach" maxlength="18"></label>
        <label class="f">City<input type="text" id="n-city" maxlength="16"></label>
        <label class="f">Team name<input type="text" id="n-nick" maxlength="14"></label>
        <label class="f">Short name (3 letters)<input type="text" id="n-abbr" maxlength="3"></label>
      </div>
      <h3>PICK A TEAM TO TAKE OVER</h3>
      <div class="teams" id="n-teams"></div>
      <h3>COLORS</h3>
      <div class="grid2"><div><div class="help">Main</div><div class="pal" id="n-c1"></div></div><div><div class="help">Trim</div><div class="pal" id="n-c2"></div></div></div>
      <div class="row" style="margin-top:14px"><button class="btn go" type="button" id="n-start">START CAREER</button><button class="btn" type="button" id="n-back">BACK</button></div>
    </div>
  </div>

  <div class="ov" id="office" hidden>
    <div class="card">
      <div class="ohead" id="o-head"></div>
      <div class="tabs" id="o-tabs"></div>
      <div class="obody" id="o-body"></div>
      <div class="ofoot" id="o-foot"></div>
    </div>
  </div>

  <div class="ov" id="drive" hidden>
    <div class="card"><h2 id="d-title">OPPONENT DRIVE</h2><ul id="d-lines"></ul><div class="row" style="margin-top:12px"><button class="btn go" type="button" id="d-go">SKIP</button></div></div>
  </div>

  <div class="ov" id="modal" hidden><div class="card" id="m-card"></div></div>

  <div class="ov" id="pause" hidden>
    <div class="card" style="width:min(420px,100%)">
      <h2>PAUSED</h2>
      <div class="choices">
        <button class="btn go" type="button" id="p-resume">RESUME</button>
        <button class="btn" type="button" id="p-settings">SETTINGS</button>
        <button class="btn" type="button" id="p-howto">HOW TO PLAY</button>
        <button class="btn red" type="button" id="p-sim">SIMULATE REST OF GAME</button>
      </div>
    </div>
  </div>

  <div class="ov" id="settings" hidden>
    <div class="card" style="width:min(520px,100%)">
      <h2>SETTINGS</h2>
      <div class="set" id="s-body"></div>
      <div class="row" style="margin-top:14px"><button class="btn go" type="button" id="s-done">DONE</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a)*k;
const rnd = (a, b) => a + Math.random()*(b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random()*a.length)];
const chance = p => Math.random() < p;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const coarse = matchMedia('(pointer:coarse)').matches;
const siteName = (() => { try { const s = JSON.parse(localStorage.getItem('arcadeSession') || 'null'); return s && s.name ? String(s.name) : ''; } catch (e){ return ''; } })();

/* ---------- settings ---------- */
const SET_KEY = 'throwback-bowl-settings-v1', SAVE_KEY = 'throwback-bowl-save-v1';
const SET_DEF = {sound:true, volume:.6, speed:1, diff:'normal', qlen:12, aimLine:true, autoRun:true};
let OPT = {...SET_DEF};
try { OPT = {...SET_DEF, ...JSON.parse(localStorage.getItem(SET_KEY) || '{}')}; } catch (e){}
const saveOpt = () => { try { localStorage.setItem(SET_KEY, JSON.stringify(OPT)); } catch (e){} };
const DIFF = {easy:{def:.88, catchAdd:.08, tack:-.08, opp:-.06, lbl:'Easy'}, normal:{def:1, catchAdd:0, tack:0, opp:0, lbl:'Normal'}, hard:{def:1.07, catchAdd:-.06, tack:.06, opp:.05, lbl:'Hard'}};
const D = () => DIFF[OPT.diff] || DIFF.normal;

/* ---------- sound (all made with WebAudio, no files) ---------- */
let actx = null, master = null;
function initAudio(){
  if (actx || !OPT.sound) return;
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = OPT.volume; master.connect(actx.destination); } catch (e){ actx = null; }
}
function tone(f, dur, type, vol, f2){
  if (!actx || !OPT.sound) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol || .12, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, rise){
  if (!actx || !OPT.sound) return;
  const t = actx.currentTime, n = Math.floor(actx.sampleRate*dur), buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
  const s = actx.createBufferSource(); s.buffer = buf; const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 800; f.Q.value = .7;
  const g = actx.createGain(); if (rise){ g.gain.setValueAtTime(.001, t); g.gain.linearRampToValueAtTime(vol, t + dur*.4); g.gain.linearRampToValueAtTime(.001, t + dur); } else { g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); }
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const SFX = {
  whistle(){ tone(2300, .35, 'sine', .08, 2100); setTimeout(() => tone(2300, .2, 'sine', .07, 2200), 120); },
  hike(){ tone(140, .08, 'square', .1, 90); },
  throw(){ noise(.25, .12, 1500); },
  catch(){ tone(660, .06, 'square', .08); setTimeout(() => tone(990, .08, 'square', .08), 60); },
  tackle(){ noise(.18, .22, 300); tone(90, .12, 'triangle', .15, 50); },
  kick(){ tone(110, .1, 'square', .15, 60); noise(.1, .15, 600); },
  cheer(){ noise(1.6, .14, 1200, true); [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, .16, 'square', .07), i*110)); },
  boo(){ noise(1, .1, 400, true); tone(220, .5, 'sawtooth', .05, 140); },
  click(){ tone(880, .04, 'square', .05); },
  juke(){ tone(500, .08, 'triangle', .08, 900); }
};

/* ---------- 3x5 pixel font for the field and scoreboard ---------- */
const GLYPH = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111',
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',
  ':':'000010000010000','-':'000000111000000','.':'000000000000010','!':'010010010000010','?':'110001010000010','&':'010101010101011','/':'001001010100100','+':'000010111010000',"'":'010010000000000','%':'101001010100101',',':'000000000010100','#':'101111101111101','(':'010100100100010',')':'010001001001010',' ':'000000000000000'
};
const cv = $('c'), g = cv.getContext('2d');
const CW = 320, CH = 180;
function txtW(s, sc){ return String(s).length*4*(sc || 1) - (sc || 1); }
function txt(s, x, y, col, sc, align, shadow){
  s = String(s).toUpperCase(); sc = sc || 1;
  if (align === 'c') x -= Math.floor(txtW(s, sc)/2); else if (align === 'r') x -= txtW(s, sc);
  if (shadow){ txt(s, x + sc, y + sc, shadow, sc); }
  g.fillStyle = col;
  for (let i = 0; i < s.length; i++){
    const gl = GLYPH[s[i]] || GLYPH['?'];
    for (let p = 0; p < 15; p++) if (gl[p] === '1') g.fillRect(x + i*4*sc + (p % 3)*sc, y + Math.floor(p/3)*sc, sc, sc);
  }
}

/* ---------- league data: all fictional ---------- */
const CITIES = ['Harbor City','Ironvale','Redwood Falls','Copper Ridge','Lakeshore','Granite Bay','Sunport','Maple Heights','Stormhaven','Dusk Valley','Pinecrest','Silver Plains','Bayfront','Glacier Point','Amberfield','Crystal Lake','Twin Rivers','Oak Hollow','Fort Ember','Eastbrook','Westmarch','Northgate','Southwind','Cobalt City','Highmoor','Saltmarsh','Rustwater','Goldcrest','Briarwood','Kingsport','Thornfield','Ravenmoor'];
const NICKS = ['Gulls','Miners','Loggers','Coyotes','Herons','Bison','Foxes','Barons','Yetis','Rhinos','Otters','Moose','Ospreys','Stingrays','Bobcats','Tornadoes','Blizzard','Volcanoes','Thunderbirds','Juggernauts','Comets','Meteors','Pioneers','Voyagers','Ironclads','Dreadnoughts','Prospectors','Wranglers','Monarchs','Sentinels','Armadillos','Walruses'];
const PALETTE = ['#d62828','#f77f00','#fcbf49','#2a9d8f','#1d6fd8','#0b2e6b','#6a2c91','#2d6a4f','#7a1f1f','#111111','#f4f1e6','#8d99ae','#e85d9a','#00b4d8','#5c3d1e','#b5e48c'];
const TEAM_COLORS = [['#1d6fd8','#f4f1e6'],['#5c3d1e','#fcbf49'],['#2d6a4f','#f4f1e6'],['#f77f00','#111111'],['#00b4d8','#0b2e6b'],['#7a1f1f','#fcbf49'],['#d62828','#f4f1e6'],['#6a2c91','#fcbf49'],
  ['#0b2e6b','#8d99ae'],['#111111','#d62828'],['#2a9d8f','#f77f00'],['#5c3d1e','#f4f1e6'],['#0b2e6b','#00b4d8'],['#8d99ae','#0b2e6b'],['#fcbf49','#7a1f1f'],['#00b4d8','#f4f1e6'],
  ['#1d6fd8','#fcbf49'],['#2d6a4f','#fcbf49'],['#d62828','#111111'],['#111111','#8d99ae'],['#6a2c91','#f4f1e6'],['#f77f00','#0b2e6b'],['#b5e48c','#2d6a4f'],['#0b2e6b','#f77f00'],
  ['#8d99ae','#d62828'],['#2a9d8f','#f4f1e6'],['#7a1f1f','#8d99ae'],['#fcbf49','#111111'],['#e85d9a','#111111'],['#6a2c91','#00b4d8'],['#111111','#fcbf49'],['#5c3d1e','#00b4d8']];
const CONFS = ['Liberty','Frontier'], DIVS = ['North','South','East','West'];
const FIRST = ['Ace','Bo','Cal','Dex','Eli','Finn','Gus','Hank','Ike','Jax','Kip','Lou','Max','Ned','Ollie','Pete','Quinn','Rex','Sam','Ty','Vic','Walt','Zeke','Abe','Buck','Cy','Dale','Earl','Flint','Grady','Hoss','Jett','Knox','Lyle','Moe','Nash','Otis','Rory','Shep','Tate','Wade','Yuri','Andre','Darius','Malik','Tariq','Jamal','Mateo','Luis','Kenji','Tomas','Rashad','Andrei','Kofi','Emeka','Diego','Jonah','Rhett'];
const LAST = ['Bolt','Carver','Dunn','Fisk','Gaines','Hart','Irons','Jupe','Kettle','Lowe','Mack','Noble','Orr','Pike','Quill','Rook','Stone','Tuck','Vance','Wolfe','York','Zane','Ballard','Crane','Drake','Ewing','Ford','Gage','Holt','Ivey','Jarvis','Kane','Lark','Moss','Nunez','Okafor','Price','Reyes','Shaw','Tran','Ueda','Voss','Webb','Xu','Yates','Barlow','Cobb','Dace','Flynn','Grant','Hayes','Kemp','Lund','Mercer','Pryor','Rusk','Sloan','Thorne'];
const POS_ATTS = {QB:['arm','acc','spd'], RB:['spd','str','agi'], WR:['spd','cat','agi'], TE:['cat','str','spd'], OL:['blk','str'], K:['pow','acc'], DL:['rush','str'], LB:['tak','cov','spd'], DB:['cov','spd','tak']};
const ATT_SHORT = {arm:'ARM',acc:'ACC',spd:'SPD',str:'STR',agi:'AGI',cat:'CAT',blk:'BLK',pow:'POW',rush:'RSH',tak:'TKL',cov:'COV'};
const ATT_NAME = {arm:'Arm',acc:'Accuracy',spd:'Speed',str:'Strength',agi:'Agility',cat:'Catching',blk:'Blocking',pow:'Kick power',rush:'Pass rush',tak:'Tackling',cov:'Coverage'};
const ROSTER_SHAPE = {QB:2, RB:2, WR:4, TE:1, OL:5, K:1, DL:4, LB:3, DB:4};
const STARTERS = {QB:1, RB:1, WR:3, TE:1, OL:5, K:1, DL:4, LB:3, DB:4};
const CAP = 200;

let S = null; // the whole career (saved)
let uid = 1;
function makePlayer(pos, base, age){

/* ---------- schedule ---------- */
function makeSchedule(){
  const weeks = [], played = new Set(), key = (a, b) => a < b ? a + '-' + b : b + '-' + a;

  const rr = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]];
  for (let k = 0; k < 6; k++){
    const wk = [];
    for (let d = 0; d < 8; d++){
      const ids = [0, 1, 2, 3].map(i => d*4 + i);
      for (const [a, b] of rr[k % 3]){ const h = k < 3 ? ids[a] : ids[b], aw = k < 3 ? ids[b] : ids[a]; wk.push({h, a:aw}); played.add(key(h, aw)); }
    }
    weeks.push(wk);
  }
  // weeks 7-16: random pairings, avoiding repeats where possible
  for (let k = 6; k < 16; k++){
    let best = null;
    for (let tries = 0; tries < 300 && !best; tries++){
      const ids = [...Array(32).keys()].sort(() => Math.random() - .5), wk = [], used = new Set();
      let ok = true;
      for (const a of ids){
        if (used.has(a)) continue;
        const b = ids.find(x => x !== a && !used.has(x) && !played.has(key(a, x)));
        if (b == null){ ok = false; break; }
        used.add(a); used.add(b); wk.push(chance(.5) ? {h:a, a:b} : {h:b, a});
      }
      if (ok) best = wk;
    }
    if (!best){ const ids = [...Array(32).keys()].sort(() => Math.random() - .5); best = []; for (let i = 0; i < 32; i += 2) best.push({h:ids[i], a:ids[i + 1]}); }
    best.forEach(m => played.add(key(m.h, m.a)));
    weeks.push(best);
  }
  return weeks;
}

    modal(`<h2>TOUCHDOWN!</h2><p>${esc(myTeam().abbr)} ${M.us} - ${M.them} ${esc(M.opp.abbr)}</p><div class="choices"><button class="btn go" data-c="xp">KICK EXTRA POINT (1)</button><button class="btn gold" data-c="two">GO FOR TWO (2)</button></div>`, c => {

    });

}
function afterOurScore(){

}
function fourthDown(){
  if (phase !== 'presnap' || M.down !== 4) return;
  const fgDist = GOAL_THEM - M.los + 17;
  const html = `<h2>4TH & ${M.fd >= GOAL_THEM ? 'GOAL' : Math.max(1, Math.round(M.fd - M.los))}</h2><p>Ball on ${yardText(M.los)}. What's the call, coach?</p>
    <div class="choices"><button class="btn go" data-c="go">GO FOR IT</button><button class="btn" data-c="punt">PUNT</button><button class="btn gold" data-c="fg" ${fgDist > 62 ? 'disabled' : ''}>FIELD GOAL (${fgDist} YDS)</button></div>`;
  modal(html, c => { if (c === 'punt') punt(); else if (c === 'fg') startKick('fg'); });
}
function punt(){
  const k = (starters('K')[0] || {att:{pow:5}}).att.pow;
  let dist = Math.round(36 + k*1.3 + rnd(-6, 6)) - irnd(0, 9);
  const land = M.los + dist;
  SFX.kick();
  const start = land >= GOAL_THEM ? 20 : clamp(Math.round(GOAL_THEM - land), 1, 99);
  toast('PUNT ' + dist + ' YARDS');
  if (tickClock(8)) return;

}
const yardText = x => { const y = Math.round(x - GOAL_US); return y === 50 ? 'MIDFIELD' : y < 50 ? 'YOUR ' + y : 'THEIR ' + (100 - y); };

/* ---------- kicking: field goals and extra points ---------- */
function startKick(mode){
  phase = 'kick';
  const spotX = (mode === 'xp' ? 95 : M.los) - 7;
  M.kick = {mode, x:spotX, y:mode === 'xp' ? MIDY : M.ballY, state:'aim', wind:mode === 'xp' ? rnd(-.4, .4) : rnd(-1.2, 1.2), ball:null, t:0, kaim:0};
  M.off = []; M.def = [];
  const K = starters('K')[0] || makePlayer('K', 4);
  M.kicker = ent('off', 'K', spotX - 2.5, M.kick.y - .6, rOf(K), K); M.off.push(M.kicker);
  M.off.push(ent('off', 'H', spotX, M.kick.y + .7, {spd:4}, null));
  for (let i = 0; i < 7; i++) M.off.push(ent('off', 'OL', spotX + 6.5, M.kick.y + (i - 3)*1.6, {spd:4, blk:5}, null));
  for (let i = 0; i < 8; i++) M.def.push(ent('def', 'DL', spotX + 7.8, M.kick.y + (i - 3.5)*1.6, M.defR()));
  M.ball = {state:'held', x:spotX, y:M.kick.y, z:0, holder:null};
  cam.x = clamp((spotX + 124)/2, 22.9, 104);
  toast(mode === 'xp' ? 'EXTRA POINT: DRAG BACK, AIM, RELEASE' : 'FIELD GOAL: DRAG BACK, AIM, RELEASE');
}
function kickFromDrag(d){
  const ax = (d.sx - d.x)/PXX, ay = (d.sy - d.y)/PXY;
  if (ax <= .2) return;
  const ang = clamp(Math.atan2(ay*.5, ax), -.5, .5), pow = clamp(Math.hypot(d.x - d.sx, d.y - d.sy)/72, .2, 1.08);
  kickNow(ang, pow);
}
function kickNow(ang, pow){
  const k = M.kick; if (!k || k.state !== 'aim') return;
  const K = M.kicker.r, v = pow*(20 + (K.pow || 5)*.9), el = 38*Math.PI/180;
  const wob = (1.2 - (K.acc || 5)*.1)*.06;
  const a = ang + rnd(-wob, wob);
  k.ball = {x:k.x, y:k.y, z:.3, vx:v*Math.cos(el)*Math.cos(a), vy:v*Math.cos(el)*Math.sin(a), vz:v*Math.sin(el)};
  k.state = 'fly'; SFX.kick(); M.stats.fga += k.mode === 'fg' ? 1 : 0;
}
function stepKick(dt){
  const k = M.kick;
  if (k.charge){ k.charge.t += dt; k.charge.pow = .2 + .88*(.5 - .5*Math.cos(k.charge.t*3.2)); }
  if (k.state === 'aim' && (keys.up || keys.down)) k.kaim = clamp((k.kaim || 0) + ((keys.down ? 1 : 0) - (keys.up ? 1 : 0))*.6*dt, -.45, .45);
  if (k.state === 'aim'){ M.ball.x = k.x; M.ball.y = k.y; M.ball.z = .3; return; }
  if (k.state === 'fly'){
    const b = k.ball;
    b.vy += k.wind*.5*dt; b.vz -= 10.7*dt;
    const px = b.x;
    b.x += b.vx*dt; b.y += b.vy*dt; b.z += b.vz*dt;
    M.ball.x = b.x; M.ball.y = b.y; M.ball.z = Math.max(0, b.z);
    cam.x = clamp(lerp(cam.x, Math.max(b.x + 6, cam.x), Math.min(1, dt*3)), 22.9, 104);
    if (px < 120 && b.x >= 120){
      const inside = Math.abs(b.y - MIDY) <= 3.1, over = b.z >= 3.33;
      const doink = Math.abs(Math.abs(b.y - MIDY) - 3.1) < .25 && b.z > 3.33;
      M.log.push('kick y=' + b.y.toFixed(1) + ' z=' + b.z.toFixed(1));
      kickResult(inside && over && !doink, doink ? 'DOINK! OFF THE UPRIGHT' : !over ? 'SHORT!' : 'WIDE ' + (b.y < MIDY ? 'LEFT' : 'RIGHT'));
      return;
    }
    if (b.z <= 0){ M.log.push('kick short at x=' + b.x.toFixed(1)); kickResult(false, 'SHORT!'); return; }
  }
  if (k.state === 'done'){ k.t -= dt; const b = k.ball; if (b){ b.vz -= 10.7*dt; b.x += b.vx*dt*.5; b.y += b.vy*dt*.5; b.z = Math.max(0, b.z + b.vz*dt); M.ball.x = b.x; M.ball.y = b.y; M.ball.z = b.z; } if (k.t <= 0) afterKick(); }
}
function kickResult(good, why){
  const k = M.kick; k.state = 'done'; k.t = 1.8; k.good = good;
  if (good){ SFX.cheer(); banner(k.mode === 'xp' ? 'EXTRA POINT GOOD' : 'FIELD GOAL IS GOOD!', 1.8, '#ffd23f'); }
  else { SFX.boo(); banner(why, 1.8, '#ff6b6b'); }
}
function afterKick(){
  const k = M.kick; M.kick = null;
  if (k.mode === 'xp'){ if (k.good) M.us += 1; afterOurScore(); return; }
  tickClock(6, true);
  if (k.good){ M.us += 3; M.stats.fg++; if (M.ot){ endGame(); return; } if (M.clock <= 0 && periodEnd()) return; oppDrive(25, 'KICKOFF: TOUCHBACK'); }
  else { if (M.clock <= 0 && periodEnd()) return; oppDrive(clamp(Math.round(GOAL_THEM - (M.los - 7)), 20, 99), 'MISSED FIELD GOAL'); }
}

/* ---------- the other team's drives are simulated, like the original ---------- */
const PLAYTXT = {
  run:['Run up the middle','Off-tackle run','Sweep to the outside','Draw play','QB keeper','Toss to the edge'],
  pass:['Short pass','Quick slant','Pass over the middle','Deep shot','Screen pass','Out route','Pass to the tight end']
};
function oppDrive(startS, why){
  phase = 'wait'; M.aim = null;
  const t = M.opp, d = (t.off - myDef()) + D().opp*10;
  const pTD = clamp(.23 + d*.035 + (startS - 25)*.0045 + D().opp, .04, .72);
  const pFG = clamp(.17 + (startS - 25)*.002, .05, .32);
  const pTO = clamp(.11 - d*.012 - D().opp*.5, .03, .26);
  const r = Math.random();
  let res = r < pTD ? 'TD' : r < pTD + pFG ? 'FG' : r < pTD + pFG + pTO ? (chance(.6) ? 'INT' : 'FUM') : chance(.85) ? 'PUNT' : 'DOWNS';
  let dur = rnd(140, 330), endS = startS;
  // a drive can't run past halftime or the end of the game
  const hardStop = (M.q === 2 || M.q >= 4) && dur > M.clock;
  if (hardStop){ dur = M.clock; if (res === 'TD' && chance(.5)) res = 'FG'; else if (res !== 'FG' || chance(.4)) res = 'END'; }
  if (M.ot && res === 'END') res = 'PUNT';
  // build a believable list of plays that add up
  const target = res === 'TD' ? 100 - startS : res === 'FG' ? clamp(100 - startS - irnd(8, 30), 5, 99 - startS) : res === 'PUNT' || res === 'DOWNS' ? irnd(-2, 28) : irnd(0, 35);
  const lines = [], n = clamp(Math.round(Math.abs(target)/8) + irnd(1, 3), 2, 11);
  let left = target, s = startS;
  for (let i = 0; i < n; i++){
    let y = i === n - 1 ? left : Math.round(left/(n - i) + rnd(-6, 8));
    if (s + y >= 100) y = 99 - s;
    const kind = chance(.55) ? 'pass' : 'run';
    if (kind === 'pass' && chance(.25) && i !== n - 1){ lines.push(pick(PLAYTXT.pass) + ' — incomplete'); continue; }
    lines.push(`${pick(PLAYTXT[kind])} for ${y} yard${Math.abs(y) === 1 ? '' : 's'}`); s += y; left -= y;
  }
  endS = clamp(s, 1, 99);
  let final = '', score = 0;
  if (res === 'TD'){ score = chance(.95) ? 7 : 6; final = 'TOUCHDOWN ' + t.abbr + (score === 7 ? ' (XP GOOD)' : ' (XP MISSED)'); }
  else if (res === 'FG'){ score = chance(.86) ? 3 : 0; final = score ? `${100 - endS + 17} YARD FIELD GOAL IS GOOD` : 'FIELD GOAL MISSED!'; }
  else if (res === 'INT') final = 'INTERCEPTED BY YOUR DEFENSE!';
  else if (res === 'FUM') final = 'FUMBLE! YOUR DEFENSE RECOVERS!';
  else if (res === 'PUNT') final = 'YOUR DEFENSE HOLDS. THEY PUNT.';
  else if (res === 'DOWNS') final = 'STOPPED ON 4TH DOWN!';
  else final = 'TIME RUNS OUT';
  M.oppNext = {res, score, endS, dur, missed:res === 'FG' && !score};
  // show it
  $('d-title').textContent = `${t.abbr} DRIVE — START AT THEIR ${startS}`;
  const ul = $('d-lines'); ul.textContent = '';
  if (why){ const li = document.createElement('li'); li.textContent = why; ul.appendChild(li); }
  const all = lines.concat([final]);
  let i = 0;
  showOnly('drive'); $('d-go').textContent = 'SKIP';
  clearInterval(M.driveTimer);
  const addLine = () => {
    if (i >= all.length){ clearInterval(M.driveTimer); $('d-go').textContent = 'CONTINUE'; return; }
    const li = document.createElement('li'); li.textContent = all[i]; if (i === all.length - 1){ li.className = 'big'; if (score) SFX.boo(); else SFX.cheer(); } ul.appendChild(li); i++;
  };
  M.driveTimer = setInterval(addLine, 420/OPT.speed);
  M.driveAll = () => { while (i < all.length) addLine(); };
  addLine();
}
$('d-go').addEventListener('click', () => {
  SFX.click();
  if ($('d-go').textContent === 'SKIP'){ M.driveAll(); clearInterval(M.driveTimer); $('d-go').textContent = 'CONTINUE'; return; }
  finishOppDrive();
});
function finishOppDrive(){
  showOnly(null);
  const o = M.oppNext; M.oppNext = null;
  if (!o) return;
  M.them += o.score;
  M.clock -= o.dur;
  if (M.ot && o.score){ endGame(); return; }
  if (M.clock <= 0){ M.clock = 0; if (periodEnd()) return; }
  if (o.res === 'TD' || (o.res === 'FG' && o.score)) kickoffToUs();
  else if (o.res === 'INT' || o.res === 'FUM') newDrive(GOAL_US + (100 - o.endS), 'TURNOVER! YOUR BALL');
  else if (o.res === 'DOWNS') newDrive(GOAL_US + (100 - o.endS), 'TAKE OVER ON DOWNS');
  else if (o.missed) newDrive(GOAL_US + clamp(100 - o.endS - 7, 20, 99), 'MISSED KICK. YOUR BALL');
  else { const land = o.endS + irnd(34, 48); newDrive(land >= 100 ? GOAL_US + 20 : GOAL_US + clamp(100 - land, 2, 98), land >= 100 ? 'PUNT: TOUCHBACK' : 'FAIR CATCH AT YOUR ' + clamp(100 - land, 2, 98)); }
}

/* ---------- end of game ---------- */
function endGame(){
  if (phase === 'over') return;
  phase = 'over'; clearInterval(M.driveTimer); $('b-pause').hidden = true;
  const won = M.us > M.them, tie = M.us === M.them;
  if (won) SFX.cheer(); else if (!tie) SFX.boo();
  banner(won ? 'VICTORY!' : tie ? 'TIE GAME' : 'DEFEAT', 3, won ? '#ffd23f' : '#ff6b6b');

}
function simRest(){
  // finish the game with the same drive model, used when you quit early
  let us = M.us, them = M.them, drives = Math.max(0, Math.round((4 - M.q)*2.6 + M.clock/(OPT.qlen*60)*2.6));
  for (let i = 0; i < drives; i++){ us += drivePts(myOff(), M.opp.def, M.home); them += drivePts(M.opp.off, myDef(), !M.home); }
  if (us === them && M.playoff){ if (chance(.5)) us += 3; else them += 3; }
  M.us = us; M.them = them; M.q = 4; M.clock = 0;
  paused = false; showOnly(null); endGame();
}

/* ---------- drawing ---------- */
function banner(text, t, col){ if (M) M.banner = {text, t, col:col || '#fff'}; }
function toast(text){ if (M) M.toast = {text, t:1.8}; }
function drawField(){
  g.fillStyle = '#245c25'; g.fillRect(0, 0, CW, CH);
  for (let x = 0; x < 120; x += 5){ const a = sxp(x), b = sxp(x + 5); if (b < 0 || a > CW) continue; g.fillStyle = (x/5) % 2 ? '#3f8f3a' : '#47993f'; g.fillRect(a, syp(0), b - a, syp(53.3) - syp(0)); }
  // end zones

  g.fillStyle = us.c1; g.fillRect(sxp(0), syp(0), sxp(10) - sxp(0), syp(53.3) - syp(0));
  g.fillStyle = th.c1; g.fillRect(sxp(110), syp(0), sxp(120) - sxp(110), syp(53.3) - syp(0));

  ez(5, us); ez(115, th);

  for (let x = 11; x < 110; x++){ if (x % 5 === 0) continue; const a = sxp(x); if (a < 0 || a > CW) continue; for (const y of [1, HASH1, HASH2, 52.3]) g.fillRect(a, syp(y), 1, 1); }
  g.fillRect(sxp(0), syp(0), sxp(120) - sxp(0), 1); g.fillRect(sxp(0), syp(53.3), sxp(120) - sxp(0), 1);
  for (let x = 20; x <= 100; x += 10){ const n = 50 - Math.abs(x - 60), a = sxp(x); if (a < -10 || a > CW + 10) continue; txt(String(n), a, syp(6), 'rgba(255,255,255,.75)', 2, 'c'); txt(String(n), a, syp(45), 'rgba(255,255,255,.75)', 2, 'c'); }

}
function drawPosts(x){
  const a = sxp(x); if (a < -20 || a > CW + 20) return;
  g.fillStyle = '#ffd23f';
  const base = syp(MIDY), bar = syp(MIDY, 3.33);

  g.fillStyle = '#ffd23f';

}
function drawPlayer(e, col1, col2, skin){
  const x = sxp(e.x), y = syp(e.y);
  if (x < -8 || x > CW + 8) return;
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(x - 3, y, 7, 2);
  const f = e.face, moving = Math.hypot(e.vx, e.vy) > .6, fr = moving ? Math.floor(e.anim*2) % 2 : 0;
  const down = phase === 'dead' && M.result && (M.result.type === 'tackle' || M.result.type === 'sack') && (e === M.ball.holder);
  if (down){ g.fillStyle = col1; g.fillRect(x - 5, y - 3, 9, 3); g.fillStyle = col2; g.fillRect(x - 6*f, y - 4, 3, 3); return; }
  // legs

  g.fillStyle = '#eee';
  if (fr){ g.fillRect(x - 3, y - 2, 2, 2); g.fillRect(x + 2, y - 2, 2, 2); } else { g.fillRect(x - 1, y - 2, 2, 2); g.fillRect(x + 1, y - 2, 1, 2); }
  g.fillStyle = '#111'; g.fillRect(fr ? x - 3 : x - 1, y - 1, 2, 1); g.fillRect(fr ? x + 2 : x + 1, y - 1, 2, 1);
  // body and arms

  g.fillStyle = col2; g.fillRect(x - 3, y - 8, 7, 1);
  g.fillStyle = skin; g.fillRect(x - 4, y - 7 + (fr ? 1 : 0), 1, 2); g.fillRect(x + 4, y - 7 + (fr ? 0 : 1), 1, 2);
  // helmet with a stripe and facemask
  g.fillStyle = col1; g.fillRect(x - 2, y - 12, 5, 4);
  g.fillStyle = col2; g.fillRect(x, y - 12, 1, 2);
  g.fillStyle = skin; g.fillRect(x + (f > 0 ? 1 : -2), y - 10, 2, 2);
  g.fillStyle = '#bbb'; g.fillRect(x + (f > 0 ? 3 : -3), y - 10, 1, 2);
}
const SKINS = ['#f1c27d','#c68642','#8d5524','#e0ac69','#5c3a21','#ffdbac'];
function draw(){
  g.imageSmoothingEnabled = false;
  if (!M){ drawTitleField(); return; }
  drawField();
  const us = myTeam(), th = M.opp;
  if (phase !== 'kick'){
    // line of scrimmage and first down line
    g.fillStyle = '#4aa3ff'; g.fillRect(sxp(M.los), syp(0), 1, syp(53.3) - syp(0));
    if (M.fd < GOAL_THEM && !M.conv){ g.fillStyle = '#ffd23f'; g.fillRect(sxp(M.fd), syp(0), 1, syp(53.3) - syp(0)); }
  }
  const all = [...M.off.map(e => [e, us.c1, us.c2]), ...M.def.map(e => [e, th.c1, th.c2])];
  all.sort((a, b) => a[0].y - b[0].y);
  for (const [e, c1, c2] of all){ if (!e.skin) e.skin = pick(SKINS); drawPlayer(e, c1, c2, e.skin); }
  // controlled player marker and stamina

  if (phase === 'live' && h && h.side === 'off'){
    const x = sxp(h.x), y = syp(h.y) - 16;

  }

    const bx = sxp(b.x), by = syp(b.y, b.z);

  } else if (b && b.holder){ const bx = sxp(b.x), by = syp(b.y, 1.2); g.fillStyle = '#7b3f12'; g.fillRect(bx - 1, by - 1, 3, 2); }

  }
  if (M.toast) txt(M.toast.text, CW/2, CH - 18, '#fff', 1, 'c', '#000');
  if (M.banner){ const s = M.banner.text.length > 14 ? 2 : 3; g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 70, CW, s*5 + 12); txt(M.banner.text, CW/2, 76, M.banner.col, s, 'c', '#000'); }
}
function drawAim(){
  if (!M.aim || !canThrow()) return;
  const t = M.aim.mode === 'keys' ? {x:M.aim.wx, y:M.aim.wy} : aimTarget(M.aim);
  const qb = M.qb, maxD = 32 + qb.r.arm*3.6;
  let dx = t.x - qb.x, dy = t.y - qb.y, dist = Math.hypot(dx, dy);
  if (dist > maxD){ dx *= maxD/dist; dy *= maxD/dist; dist = maxD; }
  const tx = qb.x + dx, ty = qb.y + dy, peak = 1.2 + dist*.12;
  if (OPT.aimLine){
    g.fillStyle = '#fff';
    for (let i = 1; i < 16; i++){ const s = i/16; g.fillRect(sxp(lerp(qb.x, tx, s)), syp(lerp(qb.y, ty, s), lerp(2, .9, s) + 4*peak*s*(1 - s)), 1, 1); }
  }
  const x = sxp(tx), y = syp(ty);
  g.fillStyle = dist >= maxD - .1 ? '#ff6b6b' : '#ffd23f';
  g.fillRect(x - 3, y, 2, 1); g.fillRect(x + 2, y, 2, 1); g.fillRect(x, y - 2, 1, 2); g.fillRect(x, y + 1, 1, 2);
}
function drawKickUI(){
  const k = M.kick; if (!k || phase !== 'kick') return;

function tabFA(){
  let h = `<p class="help">Signing costs coaching credits and the salary must fit under the cap. The list changes every week.</p><table><tr><th>POS</th><th>NAME</th><th>AGE</th><th>RATING</th><th>ATTRIBUTES</th><th>SALARY</th><th></th></tr>`;
  for (const p of S.fa) h += `<tr><td>${p.pos}</td><td>${esc(p.name)}</td><td>${p.age}</td><td class="stars">${starStr(stars(p))}</td><td>${POS_ATTS[p.pos].map(a => ATT_SHORT[a] + ' ' + p.att[a]).join(' · ')}</td><td>$${p.sal}M</td><td><button class="btn sm go" type="button" data-sign="${p.id}" ${S.cc < p.cost || payroll() + p.sal > CAP ? 'disabled' : ''}>SIGN ${p.cost} CC</button></td></tr>`;
  return h + '</table>';
}
function tabNews(){ return `<div class="news">${S.news.map(n => `<div><small>S${n.y} W${n.w}</small> ${esc(n.s)}</div>`).join('')}</div>`; }
$('o-body').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.up){ const p = S.roster.find(p => p.id === +b.dataset.up), a = b.dataset.a, c = upCost(p, a); if (S.cc >= c && p.att[a] < 10){ S.cc -= c; p.att[a]++; SFX.catch(); save(); renderOffice(); } else tone(150, .1, 'square', .08); }
  if (b.dataset.cut){ const p = S.roster.find(p => p.id === +b.dataset.cut); if (S.roster.filter(q => q.pos === p.pos).length <= STARTERS[p.pos]){ alert('You need at least ' + STARTERS[p.pos] + ' ' + p.pos + ' on the roster.'); return; } if (!confirm('Release ' + p.name + '?')) return; S.roster = S.roster.filter(q => q !== p); S.chem = clamp(S.chem - 2, 0, 100); addNews(`${p.name} (${p.pos}) released.`); save(); renderOffice(); }
  if (b.dataset.sign){ const p = S.fa.find(p => p.id === +b.dataset.sign); if (S.cc < p.cost || payroll() + p.sal > CAP) return; S.cc -= p.cost; p.yrs = irnd(1, 3); delete p.cost; S.roster.push(p); S.fa = S.fa.filter(q => q !== p); S.chem = clamp(S.chem - 1, 0, 100); addNews(`${p.name} (${p.pos}) signs with the ${myTeam().nick}!`); SFX.cheer(); save(); renderOffice(); }
  if (b.dataset.staff){ const k = b.dataset.staff, c = STAFF_COST(S.staff[k]); if (S.cc >= c && S.staff[k] < 5){ S.cc -= c; S.staff[k]++; SFX.catch(); save(); renderOffice(); } }
  if (b.dataset.fac){ const k = b.dataset.fac, c = FAC_COST(S.fac[k]); if (S.cc >= c && S.fac[k] < 5){ S.cc -= c; S.fac[k]++; SFX.catch(); save(); renderOffice(); } }
});

/* ---------- after a game: results, the week, press ---------- */
const PRESS = [
  {q:'Reporter: "Your quarterback has been criticized this week. Do you stand by him?"', a:[['He\'s our guy. Full stop.', {chem:4, fans:-1}], ['Everyone has to earn their spot.', {chem:-3, fans:2}], ['No comment.', {}]]},
  {q:'Reporter: "Fans are saying the ticket prices are too high. Thoughts?"', a:[['I\'ll talk to the owner about it.', {fans:4, cc:-1}], ['Winning costs money.', {fans:-3, cc:1}], ['I just coach the team.', {}]]},
  {q:'Reporter: "Is this the year you win the Throwback Bowl?"', a:[['Absolutely. Book the parade.', {fans:4, chem:-2}], ['One game at a time.', {chem:2}], ['Ask me in January.', {fans:1}]]},
  {q:'Reporter: "Your rival coach called your offense \'boring\'. Response?"', a:[['Scoreboard says otherwise.', {fans:3, chem:1}], ['I respect him a lot.', {chem:2}], ['We\'ll see who\'s boring Sunday.', {fans:2, chem:2}]]},
  {q:'Reporter: "A star player skipped practice. Will there be discipline?"', a:[['Rules apply to everyone.', {chem:3, fans:1}], ['It\'s handled internally.', {chem:1}], ['Stars get some slack.', {chem:-4, fans:1}]]},
  {q:'Reporter: "The defense looked tired out there. What changes?"', a:[['Extra conditioning this week.', {chem:-1, cc:1}], ['They\'ll bounce back.', {chem:3}], ['We need better players.', {chem:-4, fans:2}]]},
  {q:'Reporter: "Local kids want a team visit to their school. Will you go?"', a:[['The whole team will be there.', {fans:5, chem:2}], ['A few players will go.', {fans:2}], ['We need to focus on football.', {fans:-3}]]},
  {q:'Reporter: "Any update on that contract dispute?"', a:[['We\'ll get it done.', {chem:2, cc:-1}], ['Business is business.', {chem:-2, cc:1}], ['No update.', {}]]}
];
function gameFinished(r){
  const nx = nextGame(); if (!nx){ openOffice(); return; }
  const won = r.us > r.them, tie = r.us === r.them, me = myTeam(), opp = S.teams[nx.opp];
  if (S.phase === 'season'){
    nx.m.hs = nx.home ? r.us : r.them; nx.m.as = nx.home ? r.them : r.us;
    record(nx.m.h, nx.m.a, nx.m.hs, nx.m.as);
  } else { nx.g.hs = nx.home ? r.us : r.them; nx.g.as = nx.home ? r.them : r.us; nx.g.done = true; nx.g.win = r.us > r.them ? S.me : nx.opp; }
  // rewards
  let cc = 1 + Math.floor(S.fans/34) + (won ? 2 : 0) + (nx.home && S.fac.stadium >= 3 ? 1 : 0) + (S.phase === 'playoffs' && won ? 2 : 0);
  S.cc += cc;
  S.fans = clamp(S.fans + (won ? 3 + (S.fac.stadium - 1)*.5 : tie ? 0 : -3), 0, 100);
  S.chem = clamp(S.chem + (won ? 2 : tie ? 0 : -2), 0, 100);
  addNews(`${won ? 'WIN' : tie ? 'TIE' : 'LOSS'}: ${me.abbr} ${r.us} - ${r.them} ${opp.abbr}${M && M.py ? mvpLine() : ''}`);
  // fatigue, injuries and recovery
  for (const p of S.roster){ p.fat = clamp((p.fat || 0) - 25, 0, 100); if (p.inj > 0) p.inj--; }
  for (const pos of ['QB','RB','WR','TE']) for (const p of starters(pos)) p.fat = clamp(p.fat + irnd(8, 20), 0, 100);
  if (chance(.14 - S.fac.rehab*.02)){ const pool = S.roster.filter(p => p.inj <= 0); const p = pick(pool); p.inj = Math.max(1, irnd(1, 4) - Math.floor(S.fac.rehab/2)); addNews(`${p.name} (${p.pos}) is injured and will miss ${p.inj} week${p.inj > 1 ? 's' : ''}.`); }
  const st = M ? M.stats : null;
  const summary = `<h2>${won ? 'VICTORY!' : tie ? 'TIE GAME' : 'DEFEAT'}</h2><p style="font-size:30px">${esc(me.abbr)} ${r.us} - ${r.them} ${esc(opp.abbr)}</p>
    ${st && !r.simmed ? `<table><tr><td>Passing</td><td>${st.comp}/${st.att}, ${st.pyd} yds, ${st.ptd} TD, ${st.int} INT</td></tr><tr><td>Rushing</td><td>${st.ratt} carries, ${st.ryd} yds, ${st.rtd} TD</td></tr><tr><td>Kicking</td><td>${st.fg}/${st.fga} FG</td></tr><tr><td>Sacked</td><td>${st.sacks}</td></tr></table>` : '<p>Game simulated.</p>'}
    <p>+${cc} coaching credits</p><div class="choices"><button class="btn go" data-c="ok">CONTINUE</button></div>`;
  M = null; phase = 'menu';
  if (S.phase === 'season'){
    // play out the rest of the week
    for (const m of S.schedule[S.week]) if (m.hs == null){ const [hs, as] = simGame(m.h, m.a); m.hs = hs; m.as = as; record(m.h, m.a, hs, as); }
    S.week++;
    driftTeams(); refreshFA();
  }
  save();
  modal(summary, () => {
    const after = () => {
      if (S.phase === 'season' && S.week >= 16) startPlayoffs();
      else if (S.phase === 'playoffs') advancePlayoffs();
      else openOffice('next');
    };
    if (chance(.45)) press(after); else after();
  });
}
function mvpLine(){ const best = Object.values(M.py).sort((a, b) => b.yds + b.td*25 - a.yds - a.td*25)[0]; return best && best.yds > 0 ? ` · Star: ${best.name} (${best.yds} yds${best.td ? ', ' + best.td + ' TD' : ''})` : ''; }
function press(done){
  let i; do { i = irnd(0, PRESS.length - 1); } while (i === S.lastPress && PRESS.length > 1); S.lastPress = i;
  const q = PRESS[i];
  modal(`<h2>PRESS CONFERENCE</h2><p style="font-size:24px">${esc(q.q)}</p><div class="choices">${q.a.map((a, k) => `<button class="btn" data-c="${k}">${esc(a[0])}</button>`).join('')}</div>`, c => {
    const fx = q.a[+c][1];
    S.fans = clamp(S.fans + (fx.fans || 0), 0, 100); S.chem = clamp(S.chem + (fx.chem || 0), 0, 100); S.cc = Math.max(0, S.cc + (fx.cc || 0));
    save(); done();
  });
}
function driftTeams(){ for (const t of S.teams) if (t.id !== S.me){ t.off = clamp(t.off + rnd(-.08, .08), 2.5, 9); t.def = clamp(t.def + rnd(-.08, .08), 2.5, 9); } const me = myTeam(); me.off = myOff(); me.def = myDef(); }

/* ---------- playoffs: 6 teams per conference ---------- */
function seeds(c){
  const conf = S.teams.filter(t => t.conf === c);
  const winners = [0, 1, 2, 3].map(d => sortTeams(conf.filter(t => t.div === d))[0]);
  const ws = sortTeams(winners), rest = sortTeams(conf.filter(t => !winners.includes(t))).slice(0, 2);
  return [...ws, ...rest].map(t => t.id);
}
const ROUNDS = ['WILD CARD','DIVISIONAL ROUND','CONFERENCE FINAL','THROWBACK BOWL'];
function startPlayoffs(){
  S.phase = 'playoffs';
  const sd = [seeds(0), seeds(1)];
  const inIt = sd[0].includes(S.me) || sd[1].includes(S.me);
  S.playoffs = {round:0, roundName:ROUNDS[0], seeds:sd, alive:inIt, games:[], champ:null};
  makeRound();
  addNews(inIt ? `The ${myTeam().nick} are in the playoffs as the #${sd[myTeam().conf].indexOf(S.me) + 1} seed!` : `The ${myTeam().nick} miss the playoffs.`);
  save();
  modal(`<h2>${inIt ? 'PLAYOFFS!' : 'SEASON OVER'}</h2><p>${inIt ? `You're the #${sd[myTeam().conf].indexOf(S.me) + 1} seed in the ${CONFS[myTeam().conf]} Conference.${sd[myTeam().conf].indexOf(S.me) < 2 ? ' Top-2 seeds get a bye this round.' : ''}` : 'You missed the playoffs. The rest of the postseason will be simulated.'}</p><div class="choices"><button class="btn go" data-c="ok">CONTINUE</button></div>`, () => { if (!nextGame()) advancePlayoffs(); else openOffice('next'); });
}
function makeRound(){
  const P = S.playoffs; P.games = [];
  if (P.round === 0) for (const s of P.seeds) { P.games.push({h:s[2], a:s[5]}, {h:s[3], a:s[4]}); P.alive2 = P.alive2 || []; }
  else if (P.round === 1) for (const s of P.seeds){ const left = s.slice(2).filter(id => P.won.includes(id)).sort((a, b) => s.indexOf(a) - s.indexOf(b)); P.games.push({h:s[0], a:left[1]}, {h:s[1], a:left[0]}); }
  else if (P.round === 2) for (const s of P.seeds){ const left = s.filter(id => P.won.includes(id)).sort((a, b) => s.indexOf(a) - s.indexOf(b)); P.games.push({h:left[0], a:left[1]}); }
  else { const c0 = P.seeds[0].find(id => P.won.includes(id)), c1 = P.seeds[1].find(id => P.won.includes(id)); P.games.push(chance(.5) ? {h:c0, a:c1} : {h:c1, a:c0}); }
  P.roundName = ROUNDS[P.round];
  P.alive = P.games.some(g => g.h === S.me || g.a === S.me);
}
function advancePlayoffs(){
  const P = S.playoffs;
  // finish every game in this round
  for (const g of P.games) if (!g.done){
    if (g.h === S.me || g.a === S.me){ openOffice('next'); return; }
    let [hs, as] = simGame(g.h, g.a); if (hs === as){ if (chance(.5)) hs += 3; else as += 3; }
    g.hs = hs; g.as = as; g.done = true; g.win = hs > as ? g.h : g.a;
  }
  const winners = P.games.map(g => g.win);
  for (const g of P.games) addNews(`${ROUNDS[P.round]}: ${S.teams[g.h].abbr} ${g.hs} - ${g.as} ${S.teams[g.a].abbr}`);
  if (P.round === 3){
    P.champ = winners[0];
    const champ = S.teams[P.champ], mine = P.champ === S.me;
    if (mine){ S.titles++; S.cc += 10; S.fans = clamp(S.fans + 15, 0, 100); }
    S.history.unshift({season:S.season, champ:teamName(champ), me:`${myTeam().w}-${myTeam().l}`, won:mine});
    addNews(`The ${teamName(champ)} win the Throwback Bowl!`);
    S.phase = 'offseason'; save();
    modal(`<h2>${mine ? 'CHAMPIONS!' : 'THROWBACK BOWL'}</h2><p style="font-size:26px">${mine ? `The ${esc(teamName(champ))} win the Throwback Bowl! +10 CC` : `The ${esc(teamName(champ))} win the Throwback Bowl.`}</p><div class="choices"><button class="btn go" data-c="ok">CONTINUE</button></div>`, () => { if (mine) SFX.cheer(); openOffice('next'); });
    return;
  }
  // byes for the top two seeds join round 2
  P.won = P.round === 0 ? winners.concat(P.seeds[0].slice(0, 2), P.seeds[1].slice(0, 2)) : winners;
  P.round++; makeRound(); save();
  openOffice('next');
}

/* ---------- offseason: contracts, aging, draft ---------- */
function startOffseason(){
  // aging and progression
  const retired = [];
  for (const p of S.roster){
    p.age++; p.yrs--; p.inj = 0; p.fat = 0;
    for (const a of POS_ATTS[p.pos]){
      let d = p.age <= 25 ? irnd(0, 2) + (S.fac.training >= 4 ? 1 : 0) : p.age <= 29 ? irnd(-1, 1) : p.age <= 32 ? irnd(-2, 0) : irnd(-3, -1);
      p.att[a] = clamp(p.att[a] + d, 1, 10);
    }
    if (p.age >= 34 && chance(.45)) retired.push(p);
  }
  S.roster = S.roster.filter(p => !retired.includes(p));
  retired.forEach(p => addNews(`${p.name} (${p.pos}) retires.`));
  const expiring = S.roster.filter(p => p.yrs <= 0);
  const finish = () => draft();
  if (!expiring.length){ finish(); return; }
  contractsScreen(expiring, finish);
}
function contractsScreen(list, done){
  const row = p => { const ns = Math.round(salaryOf(p)*1.12*10)/10, c = Math.max(1, Math.round(ovr(p)/2)); return `<tr><td>${p.pos}</td><td>${esc(p.name)} (${p.age})</td><td class="stars">${starStr(stars(p))}</td><td>$${ns}M</td><td>${p.resigned ? 'RE-SIGNED' : `<button class="btn sm go" data-c="re:${p.id}" ${S.cc < c ? 'disabled' : ''}>RE-SIGN ${c} CC</button>`}</td></tr>`; };
  modal(`<h2>EXPIRING CONTRACTS</h2><p class="help">Re-sign the players you want to keep. Everyone else leaves. CC ${S.cc} · Cap $${payroll()}M / $${CAP}M</p><table>${list.map(row).join('')}</table><div class="choices"><button class="btn gold" data-c="done">DONE</button></div>`, c => {
    if (c.startsWith('re:')){
      const p = list.find(p => p.id === +c.slice(3)), cost = Math.max(1, Math.round(ovr(p)/2)), ns = Math.round(salaryOf(p)*1.12*10)/10;
      if (S.cc >= cost && payroll() - p.sal + ns <= CAP){ S.cc -= cost; p.sal = ns; p.yrs = irnd(2, 4); p.resigned = true; } else alert('Not enough CC or cap space.');
      contractsScreen(list, done); return;
    }
    for (const p of list){ if (!p.resigned){ S.roster = S.roster.filter(q => q !== p); addNews(`${p.name} (${p.pos}) leaves in free agency.`); } delete p.resigned; }
    done();
  });
}
function draft(){
  // worst record picks first; the champion picks last
  const order = S.teams.slice().sort((a, b) => pct(a) - pct(b) || (a.pf - a.pa) - (b.pf - b.pa)).map(t => t.id);
  const ci = order.indexOf(S.playoffs && S.playoffs.champ); if (ci >= 0){ order.splice(ci, 1); order.push(S.playoffs.champ); }
  const pool = [];
  const posList = ['QB','RB','WR','WR','WR','TE','OL','OL','OL','K','DL','DL','LB','LB','DB','DB'];
  for (let i = 0; i < 110; i++){ const p = makePlayer(pick(posList), rnd(2.8, 7.4), irnd(21, 23)); p.yrs = 3; p.sal = Math.round(salaryOf(p)*.6*10)/10; p.grade = ['D','C','C+','B','B+','A','A+'][clamp(Math.round(ovr(p) - 3), 0, 6)]; pool.push(p); }
  pool.sort((a, b) => ovr(b) - ovr(a));
  const D2 = {round:1, idx:0, order, pool, picks:[]};
  draftStep(D2);
}
function draftStep(D2){
  // computer teams pick until it's our turn
  while (D2.round <= 3){
    if (D2.idx >= 32){ D2.idx = 0; D2.round++; continue; }
    const t = D2.order[D2.idx];
    if (t === S.me){ draftScreen(D2); return; }
    const p = D2.pool.splice(Math.min(D2.pool.length - 1, irnd(0, 3)), 1)[0]; D2.picks.push(`R${D2.round}: ${S.teams[t].abbr} take ${p.name} (${p.pos})`);
    D2.idx++;
  }
  endDraft();
}
function draftScreen(D2){
  const pickNo = (D2.round - 1)*32 + D2.idx + 1;
  modal(`<h2>DRAFT — ROUND ${D2.round}, PICK ${pickNo}</h2><p class="help">You're on the clock. Grades are scout estimates. Recent picks: ${esc(D2.picks.slice(-3).join(' · ') || 'none')}</p><table><tr><th>POS</th><th>NAME</th><th>GRADE</th><th>ATTRIBUTES</th><th></th></tr>${D2.pool.slice(0, 14).map(p => `<tr><td>${p.pos}</td><td>${esc(p.name)}</td><td>${p.grade}</td><td>${POS_ATTS[p.pos].map(a => ATT_SHORT[a] + ' ' + p.att[a]).join(' · ')}</td><td><button class="btn sm go" data-c="${p.id}">DRAFT</button></td></tr>`).join('')}</table>`, c => {
    const p = D2.pool.find(p => p.id === +c); D2.pool = D2.pool.filter(q => q !== p);
    delete p.grade; S.roster.push(p); addNews(`Round ${D2.round}: the ${myTeam().nick} draft ${p.name} (${p.pos}).`); SFX.cheer();
    D2.idx++; draftStep(D2);
  });
}
function endDraft(){
  // make sure every position has enough players
  for (const pos in STARTERS){ while (S.roster.filter(p => p.pos === pos).length < STARTERS[pos]){ const p = makePlayer(pos, 3.5, irnd(22, 26)); p.yrs = 1; S.roster.push(p); addNews(`${p.name} (${pos}) called up from the practice squad.`); } }
  // new season
  S.season++; S.week = 0; S.phase = 'season'; S.playoffs = null;
  for (const t of S.teams){ t.w = t.l = t.t = t.pf = t.pa = 0; if (t.id !== S.me){ t.off = clamp(t.off + rnd(-.8, .8), 2.5, 9); t.def = clamp(t.def + rnd(-.8, .8), 2.5, 9); } }
  S.schedule = makeSchedule(); refreshFA(); driftTeams();
  S.cc += 4; addNews(`Season ${S.season} begins!`);
  save();
  modal(`<h2>SEASON ${S.season}</h2><p>The draft is done and a new season is here. +4 CC to get ready.</p><div class="choices"><button class="btn go" data-c="ok">TO THE OFFICE</button></div>`, () => openOffice('next'));
}

/* ---------- boot ---------- */
fit();
if (!load()) $('t-continue').hidden = true;
$('b-office').addEventListener('click', () => openOffice());
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
